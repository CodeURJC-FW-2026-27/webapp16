<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="All products with his details" />
        <meta name="author" content="" />
        <title>Bull and Pear - Tienda Online</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <link href="/css/styles.css" rel="stylesheet" />
        {{#productForm}}
        <link href="/css/product-form.css" rel="stylesheet" />
        {{/productForm}}
    </head>
    <body>
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="/">B&P</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Menú</a></li>
                        <li class="nav-item"><a class="nav-link" href="#!">Información</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Categorías</a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="/">Todos</a></li>
                                <li><hr class="dropdown-divider" /></li>
                                <li><a class="dropdown-item" href="/?category=Unisex">Unisex</a></li>
                                <li><a class="dropdown-item" href="/?category=Hombre">Hombre</a></li>
                                <li><a class="dropdown-item" href="/?category=Mujer">Mujer</a></li>
                            </ul>
                        </li>
                    </ul>
                    
                    <!-- Buscador -->
                    <form class="d-flex me-2" action="/" method="GET">
                        <input type="hidden" name="category" value="{{category}}" />
                        <label class="visually-hidden" for="buscador">Buscar productos</label>
                        <input class="form-control" type="search" id="buscador" name="search" placeholder="Buscar" maxlength="80" value="{{search}}" />
                        <button class="btn btn-outline-dark ms-2" type="submit" aria-label="Buscar"><i class="bi-search"></i></button>
                    </form>
 
                    <form class="d-flex me-2">
                        <button class="btn btn-outline-dark" type="submit">
                            <i class="bi-cart-fill me-1"></i>
                            Carrito
                            <span class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                        </button>
                    </form>
                    
                    <form class="d-flex">
                        <a class="btn btn-outline-dark mt-auto" href="/product/new">Crear producto</a>
                    </form>
                </div>
            </div>
        </nav>
        
       
        <header class="bg-brown py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Bull and Pear</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Compra los productos a buen precio</p>
                </div>
            </div>
        </header>
