<section class="mt-5" id="review-form" aria-labelledby="review-form-title">
    <h2 class="fw-bolder mb-4" id="review-form-title">{{formTitle}}</h2>
    <form method="post" action="{{formAction}}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="review-author">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text">@</span>
                    <input class="form-control" id="review-author" name="author" type="text" placeholder="usuario" maxlength="50" pattern="\S(?:[\s\S]*\S)?" title="El usuario no puede tener espacios al principio o al final." value="{{review.author}}" required />
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="review-date">Fecha</label>
                <input class="form-control" id="review-date" name="date" type="date" min="2018-01-01" max="{{today}}" value="{{review.date}}" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Puntuación</label>
                <div class="rating-selector" role="radiogroup" aria-label="Puntuación del producto">
                    {{#ratingOptions}}
                    <input class="btn-check" style="display: block" type="radio" id="rating-{{value}}" name="rating" value="{{value}}" {{#required}}required{{/required}} {{#selected}}checked{{/selected}} />
                    <label for="rating-{{value}}">{{value}}</label>
                    {{/ratingOptions}}
                </div>
            </div>
            <div class="col-12">
                <label class="form-label" for="review-comment">Escriba su reseña</label>
                <textarea class="form-control" id="review-comment" name="comment" rows="4" minlength="10" maxlength="200" title="El comentario no puede estar vacío." required>{{review.comment}}</textarea>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-dark" type="submit">{{submitText}}</button>
                {{#cancelLink}}
                <a class="btn btn-outline-dark" href="{{cancelLink}}">Cancelar</a>
                {{/cancelLink}}
            </div>
        </div>
    </form>
</section>
