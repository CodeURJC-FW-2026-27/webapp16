{{> partials/header }}

<main class="container px-4 px-lg-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm text-center p-4">
                <div class="card-body">
                    <h2 class="h3 fw-bolder mb-3">{{messageTitle}}</h2>
                    <p class="lead text-muted mb-4">{{message}}</p>
                    {{#hasErrors}}
                    <ul class="text-start text-danger">
                        {{#errors}}<li>{{.}}</li>{{/errors}}
                    </ul>
                    {{/hasErrors}}
                    <a class="btn btn-dark" href="{{#link}}{{link}}{{/link}}{{^link}}/{{/link}}">
                        {{#buttonText}}{{buttonText}}{{/buttonText}}{{^buttonText}}Volver a la página principal{{/buttonText}}
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

{{> partials/footer }}
