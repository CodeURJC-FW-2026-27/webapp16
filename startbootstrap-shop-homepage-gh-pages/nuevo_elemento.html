<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Creation of new element" />
         <meta name="author" content="" />
        <title>Crear nuevo elemento - Bull and Pear</title>
         <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/product-form.css" rel="stylesheet" />
    </head>
     <!-- Header-->
        <header class="bg-brown py-5"><!--Custom background color-->
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Bull and Pear</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Crea el producto que desees</p>
                </div>
            </div>
        </header>
    <body>
        <main class="new-product">
            <div class="container">
                <section class="new-product-card" aria-labelledby="new-product-title">
                    <h2 id="new-product-title">Datos del producto</h2>
                    <div class="new-product-field">
                        <label class="form-label" for="product-name">Nombre del producto</label>
                        <input class="form-control" id="product-name" name="product" type="text" required />
                    </div>
                    <div class="new-product-field">
                        <label class="form-label" for="price">Precio</label>
                        <input class="form-control" id="price" name="price" type="text" required />
                    </div>
                    <div class="new-product-field">
                        <label class="form-label" for="product-gender">Género del producto</label>
                        <input class="form-control" id="product-gender" name="gender" type="text" required />
                    </div>
                    <div class="new-product-field">
                        <label class="form-label" for="product-type">Tipo de producto</label>
                        <select class="form-select" id="product-type" name="product-type" required>
                            <option value="" selected disabled>Selecciona un tipo de producto</option>
                            <option value="jeans">Pantalón</option>
                            <option value="t-shirt">Camiseta</option>
                            <option value="jacket">Chaqueta</option>
                            <option value="swimwear">Bañador</option>
                            <option value="shoes">Calzado</option>
                            <option value="sweatshirt">Sudadera</option>
                            <option value="hat">Gorro</option>
                            <option value="scarf">Bufanda</option>
                            <option value="socks">Calcetines</option>
                        </select>
                    </div>
                    <div class="new-product-field">
                        <label class="form-label" for="colour">Color</label>
                        <input class="form-control" id="colour" name="colour" type="text" required />
                    </div>
                    <div class="new-product-field">
                        <label class="form-label" for="size">Tallas disponibles</label>
                        <input class="form-control" id="size" name="size" type="text" required />
                    </div>
                    <div class="new-product-field">
                        <label class="form-label" for="product-description">Descripción del producto</label>
                        <textarea class="form-control" id="product-description" name="comment" rows="4" maxlength="1000" required></textarea>
                    </div>
                    <div class="new-product-field">
                        <label class="form-label" for="materials">Materiales utilizados</label>
                        <textarea class="form-control" id="materials" name="materials" rows="3" maxlength="1000" required></textarea>
                    </div>
                    <div class="new-product-actions">
                        <a class="btn btn-outline-danger" href="index.html">Cancelar</a>
                        <button class="btn btn-save" type="button">Guardar</button>
                    </div>
                </section>
            </div>
        </main>
                         <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-center text-white">&copy; 2026 Bull and Pear</p></div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
</body>
</html>
