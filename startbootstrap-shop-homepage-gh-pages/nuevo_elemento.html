<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Creation of new element" />
         <meta name="author" content="" />
        <title>Crear nuevo elemento-Bull and Pear</title>
         <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
    </head>
     <!-- Header-->
        <header class="bg-brown py-5"><!--CAMBIO DE COLOR DE FONDO-->
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Bull and pear</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Crea el producto que desee</p>
                </div>
            </div>
        </header>
    <body>
       <div class="col-md-4">
                        <label class="form-label">Introduce el nombre del producto</label>
                        <input class="form-control" id="name product" name="product" type="text" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Introduce el precio</label>
                        <input class="form-control" id="price" name="price" type="text" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Introduce el genero del producto</label>
                        <input class="form-control" id="gender product" name="gender" type="text" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Introduce el color</label>
                        <input class="form-control" id="colour" name="colour" type="text" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Introduce los tallajes disponibles</label>
                        <input class="form-control" id="size" name="size" type="text" required />
                    </div>
                    <div class="col-8">
                        <label class="form-label">Introduce la descripcion del producto</label>
                        <input class="form-control" id="review-comment" name="comment" rows="4" maxlength="1000" required></input>
                    </div>
                    <div class="col-8">
                        <label class="form-label">Introduce los materiales que se usaron</label>
                        <input class="form-control" id="Materials" name="comment" rows="4" maxlength="1000" required></input>
                    </div>
                    <a class="btn btn-outline-danger" href="index.html">Cancelar</a>
                            <button class="btn btn-outline-dark" type="button">Guardar</button>
                        </div> 
                         <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-center text-white">&copy; 2026 Bull&Pear</p></div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
</body>
</html>
